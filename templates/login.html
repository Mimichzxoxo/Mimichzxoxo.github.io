<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Masuk - Smart RT</title>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Design System Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline": "#727781",
                    "secondary-fixed": "#a3f69c",
                    "primary-fixed": "#d3e4ff",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#88d982",
                    "on-primary-fixed": "#001c38",
                    "on-surface-variant": "#424750",
                    "surface-container": "#edeeef",
                    "tertiary-fixed-dim": "#ffba38",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#005312",
                    "on-background": "#191c1d",
                    "surface-bright": "#f8f9fa",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-high": "#e7e8e9",
                    "on-secondary-fixed": "#002204",
                    "on-tertiary-container": "#f5ac00",
                    "inverse-primary": "#a3c9ff",
                    "on-secondary-container": "#217128",
                    "inverse-on-surface": "#f0f1f2",
                    "on-primary-fixed-variant": "#004882",
                    "inverse-surface": "#2e3132",
                    "secondary": "#1b6d24",
                    "primary": "#003461",
                    "on-surface": "#191c1d",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "on-error": "#ffffff",
                    "surface": "#f8f9fa",
                    "surface-variant": "#e1e3e4",
                    "primary-fixed-dim": "#a3c9ff",
                    "on-primary-container": "#8abcff",
                    "background": "#f8f9fa",
                    "error": "#ba1a1a",
                    "tertiary-container": "#644400",
                    "secondary-container": "#a0f399",
                    "primary-container": "#004b87",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#281900",
                    "surface-dim": "#d9dadb",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#604100",
                    "tertiary-fixed": "#ffdeac",
                    "outline-variant": "#c2c6d1",
                    "on-error-container": "#93000a",
                    "tertiary": "#472f00",
                    "surface-tint": "#27609d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "margin-page": "20px",
                    "element-height-tap": "48px",
                    "gutter-grid": "16px",
                    "stack-lg": "24px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"]
            }
          }
        }
      }
    </script>
    <style>
        body { min-height: max(884px, 100dvh); font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-page">
    <main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl md:border border-outline-variant p-6 md:p-8 flex flex-col gap-stack-lg shadow-sm md:shadow-none">
        <!-- Illustration / Brand Area -->
        <div class="w-full flex justify-center mb-2">
            <div class="w-full h-[180px] bg-cover bg-center rounded-xl bg-surface-container-low border border-surface-variant relative overflow-hidden flex items-center justify-center" style="background: linear-gradient(135deg, #003461 0%, #004b87 100%);">
                <div class="text-center text-white p-4">
                    <span class="material-symbols-outlined text-6xl text-primary-fixed mb-2">roofing</span>
                    <h2 class="font-headline-lg text-2xl font-bold tracking-tight">Smart RT</h2>
                    <p class="text-xs text-primary-fixed-dim">Sistem Informasi Manajemen RT/RW Digital</p>
                </div>
            </div>
        </div>

        <!-- Header Area -->
        <div class="flex flex-col gap-stack-sm text-center md:text-left">
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Selamat Datang di Smart RT</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Masuk untuk mengakses layanan RT/RW digital Anda</p>
        </div>

        {% if error %}
        <div class="p-3 bg-error-container text-on-error-container rounded-lg text-sm flex items-center gap-2">
            <span class="material-symbols-outlined text-error">error</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form class="flex flex-col gap-stack-md w-full" action="/login" method="POST">
            <!-- Input: Identifier (Username/Email/HP) -->
            <div class="flex flex-col gap-[4px]">
                <label class="font-label-md text-label-md text-on-surface" for="identifier">Username / No HP</label>
                <div class="relative w-full">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">account_circle</span>
                    <input class="w-full h-element-height-tap pl-12 pr-4 bg-surface-container-lowest border border-outline rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="identifier" name="identifier" placeholder="Contoh: budi / admin_rt / superadmin" type="text" required/>
                </div>
            </div>

            <!-- Input: Password -->
            <div class="flex flex-col gap-[4px]">
                <label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
                <div class="relative w-full">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
                    <input class="w-full h-element-height-tap pl-12 pr-12 bg-surface-container-lowest border border-outline rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="Masukkan kata sandi Anda" type="password" required/>
                </div>
            </div>

            <!-- Demo Hint Credentials -->
            <div class="p-3 bg-surface-container-low rounded-lg text-xs space-y-1 text-on-surface-variant">
                <p class="font-semibold text-primary">Akses Cepat Demo:</p>
                <div class="flex flex-wrap gap-2 pt-1">
                    <button type="button" onclick="fillCred('budi', 'warga123')" class="px-2 py-1 bg-surface rounded border border-outline-variant hover:bg-primary-container hover:text-white transition-colors">Warga: budi / warga123</button>
                    <button type="button" onclick="fillCred('admin_rt', 'admin123')" class="px-2 py-1 bg-surface rounded border border-outline-variant hover:bg-primary-container hover:text-white transition-colors">Admin RT: admin_rt / admin123</button>
                    <button type="button" onclick="fillCred('superadmin', 'admin123')" class="px-2 py-1 bg-surface rounded border border-outline-variant hover:bg-primary-container hover:text-white transition-colors">Super Admin: superadmin / admin123</button>
                </div>
            </div>

            <!-- Primary Action -->
            <button class="w-full h-element-height-tap mt-2 bg-primary-container text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center active:scale-[0.98] transition-transform shadow-sm hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container font-semibold text-base" type="submit">
                Masuk
            </button>
        </form>

        <div class="mt-2 w-full text-center">
            <p class="font-body-md text-body-md text-on-surface-variant text-sm">
                Warga baru? <a class="font-label-md text-primary-container hover:text-primary transition-colors underline" href="#">Hubungi Pengurus RT</a>
            </p>
        </div>
    </main>

    <script>
        function fillCred(user, pass) {
            document.getElementById('identifier').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
